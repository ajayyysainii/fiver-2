name: Deploy with Pre-built Artifacts

# This workflow builds the application in GitHub Actions
# and transfers only the built files to the server
# This reduces server load and build time

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build application
        run: npm run build
        env:
          NODE_ENV: production
      
      - name: Create deployment package
        run: |
          mkdir -p deploy-package
          cp -r dist deploy-package/
          cp package.json deploy-package/
          cp package-lock.json deploy-package/
          tar -czf deploy.tar.gz deploy-package/
      
      - name: Transfer files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: "deploy.tar.gz"
          target: "/tmp/"
      
      - name: Deploy on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            # Navigate to project directory
            cd ${{ secrets.PROJECT_PATH }}
            
            # Backup current deployment
            if [ -d "dist" ]; then
              mv dist dist.backup.$(date +%Y%m%d_%H%M%S)
            fi
            
            # Extract new deployment
            tar -xzf /tmp/deploy.tar.gz -C /tmp/
            mv /tmp/deploy-package/dist ./dist
            
            # Update package files if changed
            if ! cmp -s /tmp/deploy-package/package.json package.json; then
              cp /tmp/deploy-package/package.json ./
              cp /tmp/deploy-package/package-lock.json ./
              npm ci --production
            fi
            
            # Cleanup
            rm -rf /tmp/deploy-package /tmp/deploy.tar.gz
            
            # Restart PM2
            pm2 restart ${{ secrets.PM2_APP_NAME }} || pm2 start dist/index.cjs --name ${{ secrets.PM2_APP_NAME }}
            pm2 save
            
            # Keep only last 3 backups
            ls -dt dist.backup.* 2>/dev/null | tail -n +4 | xargs rm -rf
            
            echo "✅ Deployment completed successfully!"
      
      - name: Verify deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            pm2 status ${{ secrets.PM2_APP_NAME }}
            echo "Application is running!"
      
      - name: Deployment Summary
        if: always()
        run: |
          if [ ${{ job.status }} == 'success' ]; then
            echo "✅ Deployment successful!"
            echo "Built and deployed to production server"
          else
            echo "❌ Deployment failed!"
            echo "Check the logs above for details"
          fi
